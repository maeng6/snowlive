<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주소 검색</title>
  <style>html,body{margin:0;height:100%}#wrap{width:100%;height:100vh}</style>
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
  <div id="wrap"></div>
  <script>
    new daum.Postcode({
      width: '100%',
      height: '100%',
      oncomplete: function (data) {
        var road = data.roadAddress || data.address || '';
        if (window.opener) {
          window.opener.postMessage(
            { type: 'daum_addr', zonecode: data.zonecode || '', address: road }, '*');
        }
        window.close();
      }
    }).embed(document.getElementById('wrap'));
  </script>
</body>
</html>
