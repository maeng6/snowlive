  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <script>
    // [중요] Flutter 엔진(full_page_embedding_strategy)이 기동 시 viewport 메타를
    // 자기 것(viewport-fit 없음)으로 교체해버려 standalone PWA의 safe-area 인셋이
    // 0으로 꺼진다. 메타가 바뀔 때마다 viewport-fit=cover를 다시 넣어 인셋을 유지한다.
    (function () {
      function ensureCover(m) {
        if (!m) return;
        var c = m.getAttribute('content') || '';
        if (c.indexOf('viewport-fit') === -1) {
          m.setAttribute('content', (c ? c.replace(/\s*,?\s*$/, '') + ', ' : '') + 'viewport-fit=cover');
        }
      }
      function fix() {
        var list = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < list.length; i++) ensureCover(list[i]);
      }
      fix();
      try {
        var mo = new MutationObserver(fix);
        mo.observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      } catch (e) {}
    })();
  </script>
  
  
  <style>

<body>
  <!-- 시스템 safe-area 인셋 측정용 probe. standalone(홈화면 추가) PWA에서
       env(safe-area-inset-*)가 패딩으로 들어오고, Flutter(Dart)가 이 값을 읽어
       MediaQuery.padding에 주입한다(웹 엔진이 안 넘겨주는 인셋을 대신 공급). -->
  <div id="safe-probe" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
       padding-top:constant(safe-area-inset-top);padding-top:env(safe-area-inset-top);
       padding-right:constant(safe-area-inset-right);padding-right:env(safe-area-inset-right);
       padding-bottom:constant(safe-area-inset-bottom);padding-bottom:env(safe-area-inset-bottom);
       padding-left:constant(safe-area-inset-left);padding-left:env(safe-area-inset-left);"></div>
  <script>
    // 표준 Flutter 부트스트랩(서비스워커 사용). 엔트리 파일(index.html·main.dart.js·
    // flutter_service_worker.js 등)은 호스팅 헤더에서 no-cache로 매번 재검증하고,
    // 해시 붙은 정적 에셋만 길게 캐시한다(firebase.json) → 새 배포가 바로 반영되면서도
    // 캐시 이점을 유지한다. (과거 QA의 SW 끄기/캐시 전삭제 '강제 초기화'는 제거)
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>

  <!-- 모바일 웹 접속 시 '앱으로 보기' 유도 바텀시트.
       웹은 앱 설치여부를 알 수 없어 모바일 브라우저 방문자에게 1회(7일) 안내하고,
       확인하면 app.snowlive.kr(UA 판별 스토어 라우팅)로 보낸다.
       설치형 PWA(standalone)·데스크톱은 제외. -->
  <div id="app-invite" style="display:none;">
    <div class="ai-dim"></div>
    <div class="ai-sheet" role="dialog" aria-label="앱으로 보기">
      <div class="ai-title">스노우라이브 앱으로 보실래요?</div>
      <div class="ai-desc">앱에서 더 빠르고 편하게<br>라이딩 기록·랭킹·커뮤니티를 즐겨보세요.</div>
      <button id="ai-go" class="ai-btn ai-primary">앱으로 보기</button>
      <button id="ai-no" class="ai-btn ai-ghost">웹으로 볼게요</button>
    </div>
  </div>
  <style>
    #app-invite { position:fixed; inset:0; z-index:99999;
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    #app-invite .ai-dim { position:absolute; inset:0; background:rgba(0,0,0,.45); opacity:0; transition:opacity .25s; }
    #app-invite.show .ai-dim { opacity:1; }
    #app-invite .ai-sheet { position:absolute; left:0; right:0; bottom:0; background:#fff;
      border-radius:20px 20px 0 0; padding:26px 20px calc(22px + env(safe-area-inset-bottom)); text-align:center;
      transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
      box-shadow:0 -8px 30px rgba(0,0,0,.15); max-width:520px; margin:0 auto; }
    #app-invite.show .ai-sheet { transform:translateY(0); }
    #app-invite .ai-title { font-size:19px; font-weight:800; color:#111; letter-spacing:-0.02em; }
    #app-invite .ai-desc { font-size:14px; color:#949494; line-height:1.6; margin:10px 0 20px; }
    #app-invite .ai-btn { display:block; width:100%; border:none; border-radius:12px; font-size:16px;
      font-weight:700; padding:14px; cursor:pointer; margin-top:8px; }
    #app-invite .ai-primary { background:#3D83ED; color:#fff; }
    #app-invite .ai-ghost { background:transparent; color:#949494; font-weight:600; }
  </style>
  <script>
  (function(){
    try {
      var KEY='sl_app_invite_dismiss';
      var ua=navigator.userAgent||'';
      var isIOS=/iPhone|iPad|iPod/i.test(ua);
      var isMobile=isIOS || /Android/i.test(ua);
      var isStandalone=(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                       || window.navigator.standalone===true;
      var until=parseInt(localStorage.getItem(KEY)||'0',10);
      if(!isMobile || isStandalone || Date.now()<until) return;
      var STORE='https://app.snowlive.kr/';     // UA 판별 → 앱스토어/플레이스토어
      var APP_SCHEME='snowlive://open';          // 설치돼 있으면 앱이 이 스킴으로 열림
      function remember(days){ try{ localStorage.setItem(KEY, String(Date.now()+days*864e5)); }catch(e){} }
      function hide(el){ el.classList.remove('show'); setTimeout(function(){ el.style.display='none'; },280); }
      // 앱 열기. iOS는 Universal Link(설치 시 앱, 미설치 시 /open이 스토어로 폴백),
      // Android는 커스텀 스킴 시도 후 전환 안 되면 스토어로.
      function openAppOrStore(){
        remember(7);
        if(isIOS){
          location.href='https://app.snowlive.kr/open';   // Universal Link
          return;
        }
        var switched=false;
        document.addEventListener('visibilitychange', function(){ if(document.hidden) switched=true; });
        window.addEventListener('pagehide', function(){ switched=true; });
        window.addEventListener('blur', function(){ switched=true; });
        var started=Date.now();
        location.href=APP_SCHEME;              // 설치 시 앱 열림, 미설치 시 무반응
        setTimeout(function(){
          if(!switched && !document.hidden && (Date.now()-started)<2500){ location.href=STORE; }
        }, 1400);
      }
      setTimeout(function(){
        var el=document.getElementById('app-invite'); if(!el) return;
        el.style.display='block';
        requestAnimationFrame(function(){ el.classList.add('show'); });
        document.getElementById('ai-go').addEventListener('click', openAppOrStore);
        document.getElementById('ai-no').addEventListener('click',function(){ remember(7); hide(el); });
        el.querySelector('.ai-dim').addEventListener('click',function(){ remember(1); hide(el); });
      }, 900);
    } catch(e){}
  })();
  </script>
