  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <script>
    // [중요] Flutter 엔진(full_page_embedding_strategy)이 기동 시 viewport 메타를
    // 자기 것(viewport-fit 없음)으로 교체해버려 standalone PWA의 safe-area 인셋이
    // 0으로 꺼진다. 메타가 바뀔 때마다 viewport-fit=cover를 다시 넣어 인셋을 유지한다.
    (function () {
      function ensureCover(m) {
        if (!m) return;
        var c = m.getAttribute('content') || '';
        if (c.indexOf('viewport-fit') === -1) {
          m.setAttribute('content', (c ? c.replace(/\s*,?\s*$/, '') + ', ' : '') + 'viewport-fit=cover');
        }
      }
      function fix() {
        var list = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < list.length; i++) ensureCover(list[i]);
      }
      fix();
      try {
        var mo = new MutationObserver(fix);
        mo.observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      } catch (e) {}
    })();
  </script>
  
  
  <style>
    /* 웹은 게스트 우선으로 바로 홈(중고거래 목록)에 진입하므로 별도 스플래시
       이미지 없이 흰 배경만 두고, 로딩은 앱 진입 후 화면 안에서 처리한다.
       (flutter_native_splash는 모바일 android/ios용으로만 쓰고 웹은 여기서 비활성화) */
    html, body {
      height: 100%;
      margin: 0;
      background-color: #FFFFFF;
      /* 모바일(터치)에서 탭할 때 브라우저가 캔버스 전체에 씌우는
         반투명 파란 탭 하이라이트를 끈다. */
      -webkit-tap-highlight-color: transparent;
      /* 가로 스와이프로 브라우저 뒤로/앞으로가 트리거되는 걸 줄인다(표준).
         (화면 내 뒤로가기 버튼·URL·브라우저 뒤로가기 버튼은 그대로 동작) */
      overscroll-behavior-x: none;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <!-- 시스템 safe-area 인셋 측정용 probe. standalone(홈화면 추가) PWA에서
       env(safe-area-inset-*)가 패딩으로 들어오고, Flutter(Dart)가 이 값을 읽어
       MediaQuery.padding에 주입한다(웹 엔진이 안 넘겨주는 인셋을 대신 공급). -->
  <div id="safe-probe" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;
       padding-top:constant(safe-area-inset-top);padding-top:env(safe-area-inset-top);
       padding-right:constant(safe-area-inset-right);padding-right:env(safe-area-inset-right);
       padding-bottom:constant(safe-area-inset-bottom);padding-bottom:env(safe-area-inset-bottom);
       padding-left:constant(safe-area-inset-left);padding-left:env(safe-area-inset-left);"></div>
  <script>
    // 표준 Flutter 부트스트랩(서비스워커 사용). 엔트리 파일(index.html·main.dart.js·
    // flutter_service_worker.js 등)은 호스팅 헤더에서 no-cache로 매번 재검증하고,
    // 해시 붙은 정적 에셋만 길게 캐시한다(firebase.json) → 새 배포가 바로 반영되면서도
    // 캐시 이점을 유지한다. (과거 QA의 SW 끄기/캐시 전삭제 '강제 초기화'는 제거)
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>
