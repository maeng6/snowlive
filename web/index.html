<!DOCTYPE html><html><head>
  <!--

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="스노우라이브">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>스노우라이브</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <script>
    // 가로 스와이프 뒤로가기는 전면 차단한다(앱 같은 느낌 + 캐러셀 오른쪽 스와이프
    // 중 실수로 뒤로 가는 것 방지). overscroll-behavior-x:none(아래 CSS)로 대부분
    // 막히고, 그래도 브라우저가 popstate를 쏘면 즉시 같은 위치를 다시 pushState해
    // 사실상 뒤로가기가 일어나지 않게 한다. 화면 내 뒤로가기 버튼은 GetX의
    // Get.back()을 쓰며 popstate를 발생시키지 않으므로 그대로 동작한다.
    window.addEventListener('load', function () {
      try { history.pushState(null, '', location.href); } catch (e) {}
    });
    window.addEventListener('popstate', function () {
      try { history.pushState(null, '', location.href); } catch (e) {}
    });
  </script>
  <!-- 토스페이먼츠 결제 SDK (시즌권 결제) -->

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style>
    /* 웹은 게스트 우선으로 바로 홈(중고거래 목록)에 진입하므로 별도 스플래시
       이미지 없이 흰 배경만 두고, 로딩은 앱 진입 후 화면 안에서 처리한다.
       (flutter_native_splash는 모바일 android/ios용으로만 쓰고 웹은 여기서 비활성화) */
    html, body {
      height: 100%;
      margin: 0;
      background-color: #FFFFFF;
      /* 모바일(터치)에서 탭할 때 브라우저가 캔버스 전체에 씌우는
         반투명 파란 탭 하이라이트를 끈다. */
      -webkit-tap-highlight-color: transparent;
      /* 가로 스와이프로 브라우저 뒤로/앞으로가 트리거되는 걸 줄인다(표준).
         (화면 내 뒤로가기 버튼·URL·브라우저 뒤로가기 버튼은 그대로 동작) */
      overscroll-behavior-x: none;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <script>
    // 표준 Flutter 부트스트랩(서비스워커 사용). 엔트리 파일(index.html·main.dart.js·
    // flutter_service_worker.js 등)은 호스팅 헤더에서 no-cache로 매번 재검증하고,
    // 해시 붙은 정적 에셋만 길게 캐시한다(firebase.json) → 새 배포가 바로 반영되면서도
    // 캐시 이점을 유지한다. (과거 QA의 SW 끄기/캐시 전삭제 '강제 초기화'는 제거)
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion },
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>



</body></html>
