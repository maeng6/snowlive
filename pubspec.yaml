# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/imgs/logos/
    - assets/imgs/logos/shop/
    - assets/imgs/icons/
    - assets/imgs/weather/
    - assets/imgs/profile/
    - assets/imgs/logos/brand/
    - assets/imgs/splash_screen/
    - assets/imgs/resort/
    - assets/imgs/liveCrew/
    - assets/imgs/ranking/
    - assets/imgs/imgs/
    - assets/imgs/imgs/snowballShop/
    - assets/imgs/imgs/slopeRush/gonjiam/
    - assets/imgs/imgs/slopeRush/vivaldi/
    - assets/imgs/imgs/slopeRush/phoenix/
    - assets/imgs/imgs/slopeRush/muju/
    - assets/imgs/imgs/slopeRush/alpensia/
    - assets/imgs/imgs/slopeRush/gangchon/
    - assets/imgs/imgs/slopeRush/oakvalley/
    - assets/imgs/imgs/slopeRush/o2/
    - assets/imgs/imgs/slopeRush/yongpyong/
    - assets/imgs/imgs/slopeRush/wellihilli/
    - assets/imgs/imgs/slopeRush/jisan/
    - assets/imgs/imgs/slopeRush/high1/
    - assets/json/
    - assets/video/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
   - family: SF-Pro-Text
     fonts:
        - asset: assets/fonts/SF-Pro-Text-Black.otf
          weight: 900
        - asset: assets/fonts/SF-Pro-Text-Bold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
          weight: 300
   - family: Pretendard
     fonts:
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 300
   - family: BebasNeue
     fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf


  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_native_splash:
  color: "#D8E7FD"
  image: assets/imgs/splash_screen/splash_logo.png
  fullscreen: true
  ios_content_mode: scaleAspectFill
  android: true
  android_12:
      image: assets/imgs/splash_screen/splash_logo.png
      icon_background_color: "#D8E7FD"
  ios: true
# 변경사항 필요시 flutter pub run flutter_native_splash:create 와 remove 사용



flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"